<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios en HTML</title>

  <style>
    form { max-width: 400px; }
    label { display: block; margin-top: 12px; font-weight: bold; } /* cada label en su línea */
    input[type="text"], input[type="email"], input[type="password"],
    input[type="number"], select, textarea {
      width: 100%;            /* los campos ocupan todo el ancho */
      padding: 6px;
      box-sizing: border-box; /* el padding no aumenta el ancho total */
    }
    label.inline { display: inline; font-weight: normal; } /* para radio y checkbox */
    button { margin-top: 16px; padding: 8px 20px; }
  </style>
</head>
<body>

  <h1>Registro</h1>

  <!-- action="#": no envía a ningún sitio real, es solo práctica -->
  <form action="#" method="post">

    <!-- 1. TEXTO: label enlazado con el input mediante for/id -->
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
    <!-- required: no deja enviar si está vacío -->

    <!-- 2. EMAIL: el navegador comprueba que tenga formato de correo -->
    <label for="email">Correo</label>
    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

    <!-- 3. CONTRASEÑA: se ve con puntos; minlength exige 8 caracteres -->
    <label for="pass">Contraseña</label>
    <input type="password" id="pass" name="pass" minlength="8" required>

    <!-- 4. NÚMERO con límites -->
    <label for="edad">Edad</label>
    <input type="number" id="edad" name="edad" min="16" max="99">

    <!-- 5. FECHA -->
    <label for="nacimiento">Fecha de nacimiento</label>
    <input type="date" id="nacimiento" name="nacimiento">

    <!-- 6. SELECT: lista desplegable -->
    <label for="curso">Curso</label>
    <select id="curso" name="curso">
      <option value="">-- Elige --</option>
      <option value="dam">DAM</option>
      <option value="daw">DAW</option>
      <option value="asir">ASIR</option>
    </select>

    <!-- 7. RADIO: mismo name = solo una opción -->
    <fieldset>
      <legend>Modalidad</legend>
      <input type="radio" id="pres" name="modalidad" value="presencial" checked>
      <label class="inline" for="pres">Presencial</label>
      <input type="radio" id="onl" name="modalidad" value="online">
      <label class="inline" for="onl">Online</label>
    </fieldset>

    <!-- 8. CHECKBOX: se pueden marcar varias -->
    <fieldset>
      <legend>Intereses</legend>
      <input type="checkbox" id="java" name="intereses" value="java">
      <label class="inline" for="java">Java</label>
      <input type="checkbox" id="web" name="intereses" value="web">
      <label class="inline" for="web">Web</label>
    </fieldset>

    <!-- 9. TEXTAREA: varias líneas -->
    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" rows="4"></textarea>

    <!-- 10. BOTONES -->
    <button type="submit">Enviar</button>
    <button type="reset">Borrar</button>

  </form>

</body>
</html>
