<!DOCTYPE html>
<!-- DOCTYPE: indica al navegador que el documento usa HTML5. Va siempre en la primera línea. -->
<html lang="es">
<!-- html: elemento raíz, todo lo demás va dentro de él.
     lang="es" declara el idioma: ayuda a lectores de pantalla, buscadores y traductores. -->
<head>
  <!-- head: información SOBRE la página que no se muestra en pantalla (metadatos). -->

  <meta charset="UTF-8">
  <!-- Codificación de caracteres. Con UTF-8 se ven bien tildes, ñ y símbolos. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página se adapte al ancho del móvil en vez de verse "encogida". -->

  <title>Mi primera página</title>
  <!-- Es el texto que aparece en la pestaña del navegador. -->
</head>
<body>
  <!-- body: todo lo que se ve en pantalla va aquí dentro. -->

  <h1>¡Hola, mundo!</h1>
  <!-- h1: título principal de la página. Solo debería haber uno por página. -->

  <p>Esta es mi primera página web escrita con HTML.</p>
  <!-- p: un párrafo de texto. -->

</body>
</html>
